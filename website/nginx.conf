# =============================================================================
# TIREDOFDOINTM - Nginx Configuration
# =============================================================================
# Copy this to /etc/nginx/sites-available/tiredofdointm.com
# Then: ln -s /etc/nginx/sites-available/tiredofdointm.com /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name tiredofdointm.com www.tiredofdointm.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tiredofdointm.com www.tiredofdointm.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tiredofdointm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiredofdointm.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/tiredofdointm.com/chain.pem;

    # SSL Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root and index
    root /var/www/tiredofdointm/public;
    index index.php;

    # Logging
    access_log /var/log/nginx/tiredofdointm.access.log;
    error_log /var/log/nginx/tiredofdointm.error.log;

    # Max upload size
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Handle PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Main routing - send everything to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets with long cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to hidden files (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Deny access to sensitive files
    location ~* \.(env|ini|log|sh|sql)$ {
        deny all;
    }

    # Deny access to app directories
    location ~ ^/(app|config|migrations|storage|vendor)/ {
        deny all;
    }
}
