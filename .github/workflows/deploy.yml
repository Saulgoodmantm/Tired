name: "TiredOfDoinTM - Deploy to VPS (manual)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy deploy script to server and run
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BRANCH: ${{ github.event.inputs.branch || github.ref_name || 'main' }}
        run: |
          scp -o StrictHostKeyChecking=no vps/deploy_pull.sh $VPS_USER@$VPS_HOST:/home/$VPS_USER/tiredprod_deploy.sh
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "bash /home/$VPS_USER/tiredprod_deploy.sh $BRANCH"